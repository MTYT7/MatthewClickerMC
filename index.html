<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matthew Clicker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#24152f;color:#fff8e7;font-family:Arial,sans-serif;min-height:100vh}
#app{max-width:1050px;margin:auto;padding:18px}.title{text-align:center;font-size:34px;font-weight:800;color:#ffb703;margin:5px}
.sub{text-align:center;color:#d7c6e8}.top-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(280px,.95fr);gap:14px;margin-top:16px}
.panel{background:#38234a;border:1px solid #59366e;border-radius:12px;padding:14px;box-shadow:0 5px 18px #0004}.click-panel{text-align:center;min-height:330px}.button-panel{min-height:330px}
.panel-title{font-size:20px;font-weight:800;color:#ffb703;margin-bottom:10px}.score{font-size:28px;font-weight:800;margin-top:10px}.rate{color:#d7c6e8;font-size:13px}.status{color:#ffb703;font-weight:700;min-height:20px;margin:5px}
button{cursor:pointer;border:0;border-radius:7px;padding:10px 12px;font-weight:700;margin:4px;background:#eee;color:#222}
#click{font-size:23px;background:#ffb703;color:#382000;padding:20px 55px;margin:12px 4px}.rebirth{background:#c44536;color:white;width:90%}
.progress{height:18px;background:#180e21;border-radius:10px;overflow:hidden;margin:5px 0 12px}.bar{height:100%;width:0;background:#ffb703;transition:width .08s}
.controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.controls button{width:100%;margin:0;background:#eee}
#achievement{margin-top:12px;color:#fff8e7}.upgrades-panel{margin-top:14px}.upgrade-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;max-height:500px;overflow:auto;padding-right:3px}
.upgrade{display:block;width:100%;text-align:left;background:#2d1c3c;color:#fff8e7;margin:0;border:1px solid #513362}.upgrade:hover:not(:disabled){background:#49305c}.upgrade:disabled{color:#a998b8;cursor:not-allowed}
#floatbox{position:fixed;inset:0;pointer-events:none}.float{position:absolute;color:#7cff6b;font-size:18px;font-weight:bold;animation:up .75s forwards}
@keyframes up{to{transform:translateY(-55px);opacity:0}}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modalbox{background:#24152f;border:2px solid #ffb703;border-radius:12px;padding:18px;max-width:680px;width:100%;max-height:85vh;overflow:auto}.hidden{display:none}
.gold{background:#ffd700!important;color:#4a2b12!important}.gold:hover{transform:scale(1.03)}
small{color:#d7c6e8}.close{float:right}
@media(max-width:760px){.top-layout{grid-template-columns:1fr}.button-panel{min-height:auto}.click-panel{min-height:auto}.upgrade-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app">
<div class="title">Matthew Clicker</div>
<div class="sub">Click your way to Matthew greatness!</div>

<div class="top-layout">
  <section class="panel click-panel">
    <div class="panel-title">THE CLICKER</div>
    <div id="score" class="score">0 Matthew Points</div>
    <div id="rate" class="rate"></div>
    <div id="status" class="status">Click quickly to build a combo!</div>
    <button id="click">CLICK MATTHEW!</button>
    <div>MATTHEW METER</div>
    <small id="meterText"></small>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <button id="rebirth" class="rebirth" disabled>REBIRTH</button>
  </section>

  <section class="panel button-panel">
    <div class="panel-title">THE OTHER BUTTONS</div>
    <div id="controls" class="controls"></div>
    <div class="panel" id="achievement">Achievement: Keep clicking!</div>
  </section>
</div>

<section class="panel upgrades-panel" id="upgradePanel">
  <div class="panel-title">UPGRADES & SHOP</div>
  <div id="upgradeGrid" class="upgrade-grid"></div>
</section>
</div>
<div id="floatbox"></div>
<div id="modal" class="modal hidden"><div class="modalbox"><button class="close" onclick="closeModal()">✕</button><div id="modalContent"></div></div></div>
<script>
const scoreEl=document.getElementById("score");
const rateEl=document.getElementById("rate");
const statusEl=document.getElementById("status");
const clickBtn=document.getElementById("click");
const barEl=document.getElementById("bar");
const meterTextEl=document.getElementById("meterText");
const rebirthBtn=document.getElementById("rebirth");
const controlsEl=document.getElementById("controls");
const achievementEl=document.getElementById("achievement");
const floatboxEl=document.getElementById("floatbox");
const modalEl=document.getElementById("modal");
const modalContentEl=document.getElementById("modalContent");
const upgradeGridEl=document.getElementById("upgradeGrid");
const SAVE="matthew_clicker_save";
const colors={Purple:"#24152f",Blue:"#102a43",Green:"#123524",Red:"#4a1625",Black:"#151515",Grey:"#303030",Pink:"#4a1d41",Orange:"#4a2b12"};
const upgrades=[
["Lucky Finger",25,1,"click","+1 click per tap"],["Gooner Edward Scumpi Hand",120,3,"click","+3 clicks per tap"],["Edward gooning skills",600,10,"click","+10 clicks per tap"],["Matthew balls",3000,35,"click","+35 clicks per tap"],["Turbo Finger",15000,120,"click","+120 clicks per tap"],["Edward Scumpi's gooning laptop",75000,400,"click","+400 clicks per tap"],["Pum pum power",350000,1500,"click","+1,500 clicks per tap"],["Tung tung time",1500000,6000,"click","+6,000 clicks per tap"],["Matthew Mode",7000000,25000,"click","+25,000 clicks per tap"],["Ultimate Click",30000000,100000,"click","+100,000 clicks per tap"],["When the tung farts pum pum explodes",150000000,500000,"click","+500,000 clicks per tap"],["Matthew Keyboard",800000000,2500000,"click","+2,500,000 clicks per tap"],["Leonardular Laptop",4000000000,12000000,"click","+12,000,000 clicks per tap"],["Matthew Supercomputer",20000000000,60000000,"click","+60,000,000 clicks per tap"],["Sukuna's finger",100000000000,300000000,"click","+300,000,000 clicks per tap"],
["Matthew Fan Club",100,1,"auto","+1 click per second"],["Snack Assistant",500,4,"auto","+4 clicks per second"],["Enrique Factory",2500,15,"auto","+15 clicks per second"],["Matthew Stream",12000,55,"auto","+55 clicks per second"],["Chicken Sandwich",60000,200,"auto","+200 clicks per second"],["Matthew Merch Shop",300000,750,"auto","+750 clicks per second"],["Mathwew Robot",1500000,3000,"auto","+3,000 clicks per second"],["Matthew Empire",7000000,12000,"auto","+12,000 clicks per second"],["Moon Base",35000000,50000,"auto","+50,000 clicks per second"],["Matthew Multiverse",175000000,200000,"auto","+200,000 clicks per second"],["Time Machine",900000000,850000,"auto","+850,000 clicks per second"],["Universe of Matthews",5000000000,4000000,"auto","+4,000,000 clicks per second"],["Matthew God Mode",25000000000,20000000,"auto","+20,000,000 clicks per second"],["Matthew Theme Park",125000000000,100000000,"auto","+100,000,000 clicks per second"],["Robot Matthew Army",650000000000,500000000,"auto","+500,000,000 clicks per second"],["Mathuliar CEO",3000000000000,2500000000,"auto","+2,500,000,000 clicks per second"],["Carlos",15000000000000,12000000000,"auto","+12,000,000,000 clicks per second"],["Planet Leonardo",80000000000000,300000000000,"auto","+300,000,000,000 clicks per second"]
].map(x=>({name:x[0],base:x[1],cost:x[1],power:x[2],kind:x[3],desc:x[4],level:0}));

let s={clicks:0,total:0,manual:0,auto:0,rebirths:0,crystals:0,crystalClick:0,crystalAuto:0,lastChest:0,lastSpin:0,quest:0,goal:100,bg:"#24152f",rainbow:false};
let combo=0,lastClick=0,rushEnd=0,rush=false,golden=null,start=Date.now(),lastTick=Date.now(),displayed=0;

function fmt(n){return Math.floor(n).toLocaleString("en-US")}
function power(){return 1+upgrades.filter(u=>u.kind==="click").reduce((a,u)=>a+u.level*u.power,0)}
function bonus(){return 1+s.rebirths*.25+s.crystalClick*.05}
function auto(){return upgrades.filter(u=>u.kind==="auto").reduce((a,u)=>a+u.level*u.power,0)*bonus()*(1+s.crystalAuto*.05)}
function req(){return 1000000*Math.pow(10,s.rebirths)}
function add(n,manual=false){s.clicks+=n;s.total+=n;if(manual)s.manual+=n;else s.auto+=n}
function save(){localStorage.setItem(SAVE,JSON.stringify({...s,levels:upgrades.map(u=>u.level),costs:upgrades.map(u=>u.cost),saved:Date.now()}))}
function load(){try{let d=JSON.parse(localStorage.getItem(SAVE));if(!d)return;Object.assign(s,d);upgrades.forEach((u,i)=>{u.level=+(d.levels?.[i]||0);u.cost=+(d.costs?.[i]||u.base)});let away=Math.max(0,(Date.now()-(d.saved||Date.now()))/1000),earned=auto()*away;if(earned>0){add(earned);setTimeout(()=>alert("Welcome back! Matthew earned "+fmt(earned)+" points while you were away!"),300)}}catch(e){}}
function setStatus(t,c="#ffb703"){statusEl.textContent=t;statusEl.style.color=c}
function clickGame(){let now=Date.now()/1000;combo=now-lastClick<.65?Math.min(combo+1,50):1;lastClick=now;let cb=1+combo*.02,rb=now<rushEnd?5:1,n=power()*bonus()*cb*rb;if(Math.random()<.1){n*=5;setStatus("CRITICAL CLICK! x5!","#ff4d6d")}else if(rb>1)setStatus("⚡ MATTHEW RUSH! x5! ⚡","#00ffcc");else setStatus(`Combo: ${combo} | Bonus x${cb.toFixed(2)}`);add(n,true);s.quest++;float("+"+fmt(n));checkQuest();refresh()}
function float(t){let e=document.createElement("div");e.className="float";e.textContent=t;e.style.left=(Math.random()*170+40)+"%";e.style.top=(Math.random()*70+25)+"%";floatboxEl.appendChild(e);setTimeout(()=>e.remove(),750)}
function refresh(){scoreEl.textContent=fmt(s.clicks)+" Matthew Points";rateEl.textContent=`${fmt(power()*bonus())} per click | ${fmt(auto())} per second | Rebirth x${bonus().toFixed(2)}`;let r=req(),target=Math.min(100,s.clicks/r*100);displayed+=(target-displayed)*.08;if(Math.abs(target-displayed)<.05)displayed=target;barEl.style.width=displayed+"%";meterTextEl.textContent=`${fmt(s.clicks)} / ${fmt(r)} for Rebirth ${s.rebirths+1}`;rebirthBtn.disabled=s.clicks<r;achievementEl.textContent=`${achievementText()} | Quest: ${s.quest}/${s.goal} clicks | Crystals: ${s.crystals}`}
function achievementText(){if(s.rebirths>=10)return"The One True Matthew!";if(s.rebirths>=5)return"Achievement: Matthew Legend!";if(s.rebirths>=1)return"Achievement: Reborn Matthew!";if(s.total>=1e9)return"Achievement: Billionaire Matthew!";if(s.total>=1e6)return"Achievement: Millionaire Matthew!";if(s.total>=1e4)return"Achievement: Matthew is growing!";return"Achievement: Keep clicking!"}
function openModal(html){modalContentEl.innerHTML=html;modalEl.classList.remove("hidden")}
function closeModal(){modalEl.classList.add("hidden")}
function buy(i){let u=upgrades[i];if(s.clicks<u.cost){setStatus("Not enough points!","#ff4d6d");return}s.clicks-=u.cost;u.level++;u.cost=Math.max(u.cost+1,Math.floor(u.cost*1.18));refresh();renderUpgrades()}
function showUpgrades(){document.getElementById("upgradePanel").scrollIntoView({behavior:"smooth",block:"start"});setStatus("Choose an upgrade below!","#ffb703")}
function renderUpgrades(){let h="";upgrades.forEach((u,i)=>h+=`<button class="upgrade" onclick="buy(${i})" ${s.clicks<u.cost?"disabled":""}>[${u.kind.toUpperCase()}] ${u.name} — Level ${u.level}<br><small>${u.desc} &nbsp; Cost: ${fmt(u.cost)}</small></button>`);upgradeGridEl.innerHTML=h}
function rebirth(){if(s.clicks<req())return;if(!confirm("This removes your clicks and normal upgrades.\\n\\nYou gain 1 Crystal and a permanent +25% bonus.\\n\\nRebirth now?"))return;s.rebirths++;s.crystals++;s.clicks=0;combo=0;upgrades.forEach(u=>{u.level=0;u.cost=u.base});refresh();alert(`Rebirth ${s.rebirths} complete!\\nYou earned 1 Matthew Crystal.\\nPermanent multiplier: x${bonus().toFixed(2)}`)}
function checkQuest(){if(s.quest<s.goal)return;let r=Math.max(s.goal*power()*bonus(),1000);add(r);alert(`You clicked ${s.goal} times!\\n\\nReward: ${fmt(r)} Matthew Points!`);s.quest=0;s.goal=Math.floor(s.goal*1.5)}
function chest(){let now=Date.now()/1000;if(now-s.lastChest<3600){alert("Come back in about "+(Math.floor((3600-now+s.lastChest)/60)+1)+" minutes!");return}let r=Math.max(auto()*300,power()*bonus()*500,1000);add(r);s.lastChest=now;setStatus("DAILY CHEST OPENED!","#ffd700");alert("You found "+fmt(r)+" Matthew Points!");refresh()}
function spin(){let now=Date.now()/1000;if(now-s.lastSpin<60){alert("Wait "+(Math.floor(60-now+s.lastSpin)+1)+" seconds to spin again!");return}s.lastSpin=now;let a=[["Small prize",Math.max(100,power()*10)],["Big prize",Math.max(1000,power()*100)],["Amazing prize",Math.max(10000,auto()*30)],["Jackpot!",Math.max(50000,auto()*100)],["Matthew Crystal","crystal"]],x=a[Math.floor(Math.random()*a.length)];if(x[1]==="crystal"){s.crystals++;alert("You won a Matthew Crystal!");setStatus("LUCKY SPIN: MATTHEW CRYSTAL!","#00ffcc")}else{add(x[1]);alert(x[0]+"\\n\\nYou won "+fmt(x[1])+" Matthew Points!");setStatus("LUCKY SPIN! +"+fmt(x[1])+" points!","#00ffcc")}refresh()}
function crystalShop(){openModal(`<h2>Matthew Crystal Shop</h2><p>Matthew Crystals: ${s.crystals}</p><button onclick="buyCrystal(0)">Crystal Finger — Cost: ${s.crystalClick+1} crystals<br><small>+5% permanent click power</small></button><br><button onclick="buyCrystal(1)">Crystal Engine — Cost: ${s.crystalAuto+1} crystals<br><small>+5% permanent auto power</small></button>`)}
function buyCrystal(type){let cost=type?s.crystalAuto+1:s.crystalClick+1;if(s.crystals<cost){alert("You need more Matthew Crystals!");return}s.crystals-=cost;if(type)s.crystalAuto++;else s.crystalClick++;refresh();crystalShop()}
function settings(){let opts=Object.keys(colors).map(x=>`<option>${x}</option>`).join("");openModal(`<h2>BACKGROUND SETTINGS</h2><select id="colour">${opts}</select><br><button onclick="s.rainbow=false;s.bg=colors[colour.value];applyTheme();closeModal()">Use Selected Colour</button><br><button onclick="s.rainbow=true;closeModal()">Rainbow Background</button>`)}
function applyTheme(){document.body.style.background=s.bg}
function stats(){let sec=Math.floor((Date.now()-start)/1000);alert(`Current points: ${fmt(s.clicks)}\\nTotal points: ${fmt(s.total)}\\nManual points: ${fmt(s.manual)}\\nAuto points: ${fmt(s.auto)}\\nRebirths: ${s.rebirths}\\nCrystals: ${s.crystals}\\nTime played: ${Math.floor(sec/60)}m ${sec%60}s`)}
function reset(){if(!confirm("Delete all points, upgrades, rebirths, and crystals?"))return;localStorage.removeItem(SAVE);location.reload()}
let goldenTimer=null;
function spawnGolden(){if(golden)return;golden=document.createElement("button");golden.className="gold";golden.textContent="⭐ GOLDEN MATTHEW! ⭐";golden.onclick=collectGolden;document.querySelector(".click-panel").appendChild(golden);goldenTimer=setTimeout(removeGolden,8000)}
function collectGolden(){let r=Math.max(power()*bonus()*100,auto()*20,1000);add(r);setStatus("GOLDEN MATTHEW! +"+fmt(r)+" points!","#ffd700");removeGolden();refresh()}
function removeGolden(){if(goldenTimer){clearTimeout(goldenTimer);goldenTimer=null}if(golden){golden.remove();golden=null}}
function startRush(){if(rush)return;rush=true;rushEnd=Date.now()/1000+12;setStatus("⚡ MATTHEW RUSH! Clicks are x5 for 12 seconds! ⚡","#00ffcc");setTimeout(()=>{rush=false;setStatus("Matthew Rush ended!")},12000)}
function buildControls(){controlsEl.innerHTML=`<button onclick="showUpgrades()">Upgrades</button><button onclick="stats()">Statistics</button><button onclick="settings()">Settings</button><button onclick="save()">Save</button><button onclick="reset()">Reset</button><button onclick="chest()">Daily Chest</button><button onclick="spin()">Lucky Spin</button><button onclick="crystalShop()">Crystal Shop</button><button onclick="window.close()">Quit</button>`}
clickBtn.onclick=clickGame;rebirthBtn.onclick=rebirth;load();buildControls();applyTheme();renderUpgrades();refresh();
setInterval(()=>{let now=Date.now(),dt=Math.min((now-lastTick)/1000,2);lastTick=now;let e=auto()*dt;if(e>0)add(e);refresh()},100);
setInterval(save,30000);setInterval(()=>{if(s.rainbow){let h=(Date.now()/1000*.004)%1;document.body.style.background=`hsl(${h*360},55%,18%)`}},80);
setTimeout(spawnGolden,30000);setInterval(()=>setTimeout(spawnGolden,Math.random()*25000+35000),35000);
setTimeout(startRush,45000);setInterval(()=>setTimeout(startRush,Math.random()*40000+60000),60000);
window.addEventListener("beforeunload",save);
</script>
</body>
</html>
