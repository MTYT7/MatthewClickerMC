let combo=0,lastClick=0,rushEnd=0,rush=false,golden=null,start=Date.now(),lastTick=Date.now(),displayed=0;
let buyAmount="1";
function setBuyAmount(value){buyAmount=value;}

function fmt(n){return Math.floor(n).toLocaleString("en-US")}
function power(){return 1+upgrades.filter(u=>u.kind==="click").reduce((a,u)=>a+u.level*u.power,0)}
function bonus(){return (1+s.rebirths*.25+s.crystalClick*.05)*(1+s.crystalClick2*.10)}
function auto(){return upgrades.filter(u=>u.kind==="auto").reduce((a,u)=>a+u.level*u.power,0)*bonus()*(1+s.crystalAuto*.05)*(1+s.crystalAuto2*.10)}
function req(){return 1000000*Math.pow(10,s.rebirths)}
function add(n,manual=false){s.clicks+=n;s.total+=n;if(manual)s.manual+=n;else s.auto+=n}
function snapshot(){return {...s,levels:upgrades.map(u=>u.level),costs:upgrades.map(u=>u.cost),saved:Date.now()}}
function save(){try{const data=snapshot();saveSlots[activeSlot]=saveSlots[activeSlot]||{name:`Save ${activeSlot}`};saveSlots[activeSlot].data=data;localStorage.setItem(SLOTS_KEY,JSON.stringify(saveSlots));localStorage.setItem(ACTIVE_KEY,String(activeSlot));localStorage.setItem(SAVE,JSON.stringify(data));return true}catch(e){console.error("Save failed",e);return false}}
function applySave(d){if(!d)return;Object.assign(s,d);const levels=d.levels||[],costs=d.costs||[];const oldClickCount=15,oldAutoCount=18;upgrades.forEach((u,i)=>{let oldIndex=i;if(levels.length===oldClickCount+oldAutoCount&&i>=oldClickCount&&i<oldClickCount+50+oldAutoCount)oldIndex=i<oldClickCount+50?-1:i-50;u.level=oldIndex>=0?+(levels[oldIndex]||0):0;u.cost=oldIndex>=0?+(costs[oldIndex]||u.base):u.base})}
function load(){try{saveSlots=JSON.parse(localStorage.getItem(SLOTS_KEY)||"{}");let legacy=JSON.parse(localStorage.getItem(SAVE)||"null");if(!saveSlots[1]&&legacy)saveSlots[1]={name:"Main Save",data:legacy};if(!saveSlots[activeSlot])activeSlot=saveSlots[1]?1:1;if(saveSlots[activeSlot]?.data){let d=saveSlots[activeSlot].data;applySave(d);let away=Math.max(0,(Date.now()-(d.saved||Date.now()))/1000),earned=auto()*Math.min(away,86400);if(earned>0){add(earned);setTimeout(()=>alert("Welcome back! Matthew earned "+fmt(earned)+" points while you were away!"),300)}}save()}catch(e){console.error("Save could not be loaded",e)}}
function freshState(){return {clicks:0,total:0,manual:0,auto:0,rebirths:0,crystals:0,crystalClick:0,crystalAuto:0,crystalClick2:0,crystalAuto2:0,lastChest:0,lastSpin:0,quest:0,goal:100,bg:"#24152f",rainbow:false,usedCodes:[]}}
function resetUpgrades(){upgrades.forEach(u=>{u.level=0;u.cost=u.base})}
function saveManager(){save();let cards="";for(let i=1;i<=5;i++){let slot=saveSlots[i],d=slot?.data;let summary=d?`${fmt(d.clicks||0)} points · ${d.rebirths||0} rebirths`:"Empty slot";cards+=`<div class="save-slot-card"><strong>Slot ${i}: ${escapeHtml(slot?.name||`Save ${i}`)}</strong><p>${summary}${i===activeSlot?" · <b>ACTIVE</b>":""}</p><button onclick="switchSave(${i})" ${i===activeSlot?"disabled":""}>${d?"Load Save":"Create Save"}</button> <button onclick="renameSave(${i})">Rename</button> <button onclick="deleteSave(${i})" ${d?"":"disabled"}>Delete</button></div>`}openModal(`<h2>💾 Save Manager</h2><p>Each slot has its own points, upgrades, crystals and settings. Your existing game is kept in Slot 1.</p>${cards}<p><button onclick="exportSave()">Export Active Save</button> <button onclick="document.getElementById('importSaveFile').click()">Import Save</button><input id="importSaveFile" type="file" accept="application/json,.json" style="display:none" onchange="importSaveFile(this)"></p>`)}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function switchSave(i){save();if(!saveSlots[i]?.data){if(!confirm(`Create a new empty game in Slot ${i}?`))return;saveSlots[i]={name:`Save ${i}`,data:{...freshState(),levels:upgrades.map(()=>0),costs:upgrades.map(u=>u.base),saved:Date.now()}}}activeSlot=i;localStorage.setItem(ACTIVE_KEY,String(i));applySave(saveSlots[i].data);save();applyTheme();renderUpgrades();refresh();setStatus(`Loaded ${saveSlots[i].name}!`,"#00ffcc");saveManager()}
function renameSave(i){if(!saveSlots[i])saveSlots[i]={name:`Save ${i}`,data:null};let name=prompt("Name this save:",saveSlots[i].name||`Save ${i}`);if(name===null)return;name=name.trim().slice(0,32);if(!name){alert("Please enter a name.");return}saveSlots[i].name=name;save();saveManager()}
function deleteSave(i){
  const slot=saveSlots[i];
  if(!slot?.data)return;
  if(!confirm(`Delete Slot ${i} (${slot.name||`Save ${i}`})? This cannot be undone.`))return;
  if(i===activeSlot){
    // Keep the active slot selected, but clear its progress immediately.
    s=freshState();resetUpgrades();
    saveSlots[i]={name:slot.name||`Save ${i}`,data:snapshot()};
    applyTheme();renderUpgrades();refresh();setStatus(`Slot ${i} deleted and reset.`,"#00ffcc");
  }else{
    saveSlots[i]={name:slot.name||`Save ${i}`,data:null};
  }
  localStorage.setItem(SLOTS_KEY,JSON.stringify(saveSlots));
  localStorage.setItem(ACTIVE_KEY,String(activeSlot));
  localStorage.setItem(SAVE,JSON.stringify(snapshot()));
  saveManager();
}
function exportSave(){save();let blob=new Blob([JSON.stringify({app:"MatthewClicker",version:"1.04",slot:activeSlot,save:saveSlots[activeSlot].data},null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`MatthewClicker-Save-${activeSlot}.json`;a.click();URL.revokeObjectURL(url)}
function importSaveFile(input){let file=input.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result),d=obj.save||obj;if(!d||typeof d.clicks!=="number"||!Array.isArray(d.levels))throw Error("Invalid save file");if(!confirm(`Import this save into active Slot ${activeSlot}, replacing its current progress?`))return;saveSlots[activeSlot]=saveSlots[activeSlot]||{name:`Save ${activeSlot}`};saveSlots[activeSlot].data=d;applySave(d);save();applyTheme();renderUpgrades();refresh();saveManager();alert("Save imported!")}catch(e){alert("That file isn't a valid Matthew Clicker save.")}};reader.readAsText(file)}
function setStatus(t,c="#ffb703"){statusEl.textContent=t;statusEl.style.color=c}
function clickGame(){let now=Date.now()/1000;combo=now-lastClick<.65?Math.min(combo+1,50):1;lastClick=now;let cb=1+combo*.02,rb=now<rushEnd?5:1,n=power()*bonus()*cb*rb;if(Math.random()<.1){n*=5;setStatus("CRITICAL CLICK! x5!","#ff4d6d")}else if(rb>1)setStatus("⚡ MATTHEW RUSH! x5! ⚡","#00ffcc");else setStatus(`Combo: ${combo} | Bonus x${cb.toFixed(2)}`);add(n,true);s.quest++;float("+"+fmt(n));checkQuest();refresh()}
function float(t){let e=document.createElement("div");e.className="float";e.textContent=t;e.style.left=(Math.random()*170+40)+"%";e.style.top=(Math.random()*70+25)+"%";floatboxEl.appendChild(e);setTimeout(()=>e.remove(),750)}
function refresh(){scoreEl.textContent=fmt(s.clicks)+" Matthew Points";rateEl.textContent=`${fmt(power()*bonus())} per click | ${fmt(auto())} per second | Rebirth x${bonus().toFixed(2)}`;let r=req(),target=Math.min(100,s.clicks/r*100);displayed+=(target-displayed)*.08;if(Math.abs(target-displayed)<.05)displayed=target;barEl.style.width=displayed+"%";meterTextEl.textContent=`${fmt(s.clicks)} / ${fmt(r)} for Rebirth ${s.rebirths+1}`;rebirthBtn.disabled=s.clicks<r;document.querySelectorAll(".upgrade").forEach((b)=>{const match=b.getAttribute("onclick")?.match(/buy\((\d+)\)/);if(match){const u=upgrades[Number(match[1])];if(u)b.disabled=s.clicks<u.cost;}});achievementEl.textContent=`${achievementText()} | Quest: ${s.quest}/${s.goal} clicks | Crystals: ${s.crystals}`}
function achievementText(){if(s.rebirths>=10)return"The One True Matthew!";if(s.rebirths>=5)return"Achievement: Matthew Legend!";if(s.rebirths>=1)return"Achievement: Reborn Matthew!";if(s.total>=1e9)return"Achievement: Billionaire Matthew!";if(s.total>=1e6)return"Achievement: Millionaire Matthew!";if(s.total>=1e4)return"Achievement: Matthew is growing!";return"Achievement: Keep clicking!"}
function openModal(html){modalContentEl.innerHTML=html;modalEl.classList.remove("hidden")}
function closeModal(){modalEl.classList.add("hidden")}
function buy(i){
  const u=upgrades[i];
  let quantity=buyAmount==="max"?Infinity:Math.max(1,Number(buyAmount)||1);
  let totalCost=0,count=0,nextCost=u.cost;
  while(count<quantity && s.clicks-totalCost>=nextCost && count<100000){
    totalCost+=nextCost;count++;
    nextCost=Math.max(nextCost+1,Math.floor(nextCost*1.18));
  }
  if(count===0){setStatus("Not enough points!","#ff4d6d");return;}
  s.clicks-=totalCost;u.level+=count;u.cost=nextCost;
  setStatus(`Bought ${count} level${count===1?"":"s"} of ${u.name}!`,"#00ffcc");
  refresh();renderUpgrades();save();
}
function showUpgrades(){document.getElementById("upgradePanel").scrollIntoView({behavior:"smooth",block:"start"});setStatus("Choose an upgrade below!","#ffb703")}
function renderUpgrades(){
  const previousScroll=[...upgradeGridEl.querySelectorAll(".upgrade-column")].map(el=>el.scrollTop);
  const makeList=(kind,title,index)=>{let list=upgrades.map((u,i)=>({u,i})).filter(x=>x.u.kind===kind);return `<section class="upgrade-column"><h3>${title}</h3><div class="upgrade-list">${list.map(({u,i})=>`<button class="upgrade" onclick="buy(${i})" ${s.clicks<u.cost?"disabled":""}>${u.name} — Level ${u.level}<br><small>${u.desc} &nbsp; Cost: ${fmt(u.cost)}</small></button>`).join("")}</div></section>`};
  upgradeGridEl.innerHTML=makeList("auto","⚙️ Per Second / Auto",0)+makeList("click","👆 Per Tap",1);
  [...upgradeGridEl.querySelectorAll(".upgrade-column")].forEach((el,i)=>{el.scrollTop=previousScroll[i]||0;});
}
function rebirth(){if(s.clicks<req())return;if(!confirm("This removes your clicks and normal upgrades.\\n\\nYou gain 1 Crystal and a permanent +25% bonus.\\n\\nRebirth now?"))return;s.rebirths++;s.crystals++;s.clicks=0;combo=0;upgrades.forEach(u=>{u.level=0;u.cost=u.base});refresh();alert(`Rebirth ${s.rebirths} complete!\\nYou earned 1 Matthew Crystal.\\nPermanent multiplier: x${bonus().toFixed(2)}`)}
function checkQuest(){if(s.quest<s.goal)return;let r=Math.max(s.goal*power()*bonus(),1000);add(r);alert(`You clicked ${s.goal} times!\\n\\nReward: ${fmt(r)} Matthew Points!`);s.quest=0;s.goal=Math.floor(s.goal*1.5)}
function chest(){let now=Date.now()/1000;if(now-s.lastChest<86400){let left=Math.ceil((86400-(now-s.lastChest))/3600);alert("Your daily chest is cooling down! Come back in about "+left+" hour(s).");return}let r=Math.max(auto()*300,power()*bonus()*500,1000);add(r);s.lastChest=now;setStatus("DAILY CHEST OPENED!","#ffd700");alert("You found "+fmt(r)+" Matthew Points!");refresh()}
function spin(){let now=Date.now()/1000;if(now-s.lastSpin<60){alert("Wait "+(Math.floor(60-now+s.lastSpin)+1)+" seconds to spin again!");return}s.lastSpin=now;let a=[["Small prize",Math.max(100,power()*10)],["Big prize",Math.max(1000,power()*100)],["Amazing prize",Math.max(10000,auto()*30)],["Jackpot!",Math.max(50000,auto()*100)],["Matthew Crystal","crystal"]],x=a[Math.floor(Math.random()*a.length)];if(x[1]==="crystal"){s.crystals++;alert("You won a Matthew Crystal!");setStatus("LUCKY SPIN: MATTHEW CRYSTAL!","#00ffcc")}else{add(x[1]);alert(x[0]+"\\n\\nYou won "+fmt(x[1])+" Matthew Points!");setStatus("LUCKY SPIN! +"+fmt(x[1])+" points!","#00ffcc")}refresh()}
function crystalShop(){openModal(`<h2>Matthew Crystal Shop</h2><p>Matthew Crystals: ${s.crystals}</p><button onclick="buyCrystal(0)">Crystal Finger — Cost: ${s.crystalClick+1} crystals<br><small>+5% permanent click power</small></button><br><button onclick="buyCrystal(1)">Crystal Engine — Cost: ${s.crystalAuto+1} crystals<br><small>+5% permanent auto power</small></button><br><button onclick="buyCrystal(2)">Crystal Overdrive — Cost: ${(s.crystalClick2+1)*3} crystals<br><small>+10% permanent click power</small></button><br><button onclick="buyCrystal(3)">Crystal Reactor — Cost: ${(s.crystalAuto2+1)*3} crystals<br><small>+10% permanent auto power</small></button>`)}
function buyCrystal(type){let cost=type===0?s.crystalClick+1:type===1?s.crystalAuto+1:type===2?(s.crystalClick2+1)*3:(s.crystalAuto2+1)*3;if(s.crystals<cost){alert("You need more Matthew Crystals!");return}s.crystals-=cost;if(type===0)s.crystalClick++;else if(type===1)s.crystalAuto++;else if(type===2)s.crystalClick2++;else s.crystalAuto2++;refresh();crystalShop()}
function settings(){let opts=Object.keys(colors).map(x=>`<option>${x}</option>`).join("");openModal(`<h2>BACKGROUND SETTINGS</h2><select id="colour">${opts}</select><br><button onclick="s.rainbow=false;s.bg=colors[colour.value];applyTheme();save();closeModal()">Use Selected Colour</button><br><button onclick="s.rainbow=!s.rainbow;applyTheme();save();closeModal()">Toggle Rainbow Mode</button>`)}
function codes(){openModal(`<h2>🎁 Redeem a Code</h2><p>Enter a code to claim its reward. Each code can only be used once on this save.</p><input id="codeInput" class="code-input" maxlength="40" autocomplete="off" placeholder="Enter code here"><br><button onclick="redeemCode()">Redeem Code</button><p class="code-note">Tip: codes are not case-sensitive.</p><div id="codeMessage" role="status"></div>`);setTimeout(()=>document.getElementById("codeInput")?.focus(),0)}
function redeemCode(){const input=document.getElementById("codeInput");const message=document.getElementById("codeMessage");if(!input||!message)return;const code=input.value.trim().toLowerCase().replace(/\s+/g,"");const rewards={leonardo:{points:1000000000,label:"Leonardo"},adminpayout:{points:10000000000,label:"Admin Payout"}};if(!code){message.textContent="Please enter a code first.";return}if(!rewards[code]){message.textContent="That code does not exist.";return}if((s.usedCodes||[]).includes(code)){message.textContent="You have already redeemed this code.";return}const reward=rewards[code];s.usedCodes=s.usedCodes||[];s.usedCodes.push(code);add(reward.points,true);save();refresh();setStatus(reward.label.toUpperCase()+" CODE REDEEMED!","#00ffcc");message.textContent="Success! You received "+fmt(reward.points)+" Matthew Points!";input.value=""}
function applyTheme(){document.body.classList.toggle("rainbow-mode",!!s.rainbow);if(!s.rainbow){document.body.style.background=s.bg;document.body.style.removeProperty("--rainbow-hue")}else{updateRainbowTheme()}}
function updateRainbowTheme(){const hue=(Date.now()/28)%360;document.body.style.setProperty("--rainbow-hue",hue);document.body.style.background=`hsl(${hue},65%,16%)`;document.body.classList.add("rainbow-mode")}
function stats(){let sec=Math.floor((Date.now()-start)/1000);alert(`Current points: ${fmt(s.clicks)}\\nTotal points: ${fmt(s.total)}\\nManual points: ${fmt(s.manual)}\\nAuto points: ${fmt(s.auto)}\\nRebirths: ${s.rebirths}\\nCrystals: ${s.crystals}\\nTime played: ${Math.floor(sec/60)}m ${sec%60}s`)}
function reset(){s=freshState();resetUpgrades();save();applyTheme();renderUpgrades();refresh();closeModal();setStatus("Current save reset! Other save slots are safe.","#00ffcc")}
let goldenTimer=null;
function spawnGolden(){if(golden)return;golden=document.createElement("button");golden.className="gold";golden.textContent="⭐ GOLDEN MATTHEW! ⭐";golden.onclick=collectGolden;document.querySelector(".click-panel").appendChild(golden);goldenTimer=setTimeout(removeGolden,8000)}
function collectGolden(){let r=Math.max(power()*bonus()*100,auto()*20,1000);add(r);setStatus("GOLDEN MATTHEW! +"+fmt(r)+" points!","#ffd700");removeGolden();refresh()}
function removeGolden(){if(goldenTimer){clearTimeout(goldenTimer);goldenTimer=null}if(golden){golden.remove();golden=null}}
function startRush(){if(rush)return;rush=true;rushEnd=Date.now()/1000+12;setStatus("⚡ MATTHEW RUSH! Clicks are x5 for 12 seconds! ⚡","#00ffcc");setTimeout(()=>{rush=false;setStatus("Matthew Rush ended!")},12000)}
function buildControls(){controlsEl.innerHTML=`<button onclick="showUpgrades()">Upgrades</button><button onclick="stats()">Statistics</button><button onclick="settings()">Settings</button><button onclick="save()">Save</button><button onclick="saveManager()">Save Manager</button><button onclick="reset()">Reset</button><button onclick="chest()">Daily Chest</button><button onclick="spin()">Lucky Spin</button><button onclick="crystalShop()">Crystal Shop</button><button onclick="codes()">Redeem Codes</button><button onclick="window.close()">Quit</button>`}
clickBtn.onclick=clickGame;rebirthBtn.onclick=rebirth;load();buildControls();applyTheme();renderUpgrades();refresh();
setInterval(()=>{let now=Date.now(),dt=Math.min((now-lastTick)/1000,2);lastTick=now;let e=auto()*dt;if(e>0)add(e);refresh()},100);
setInterval(save,30000);setInterval(()=>{if(s.rainbow){updateRainbowTheme()}else{document.body.classList.remove("rainbow-mode");document.body.style.background=s.bg}},60);
setTimeout(spawnGolden,30000);setInterval(()=>setTimeout(spawnGolden,Math.random()*25000+35000),35000);
setTimeout(startRush,45000);setInterval(()=>setTimeout(startRush,Math.random()*40000+60000),60000);
window.addEventListener("beforeunload",save);
</script>
</body>
